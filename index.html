<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e142e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="云上人间">
<title>云上人间 · 仙缘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a2238; --paper:#fbf6ea; --paper2:#f3ead6; --line:#e0cfa3;
    --gold:#c9a24e; --gold2:#e8cf8a; --ver:#b23a2e; --ver2:#8f2a22;
    --navy:rgba(12,18,44,.74); --txt:#f4e6c4; --muted:#b9a984;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#060b26;color:var(--ink);
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #sky{position:fixed;inset:0;z-index:0}
  #app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

  .frame{background:var(--navy);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--txt);border-radius:6px;
    border:1px solid rgba(201,162,78,.6);box-shadow:inset 0 0 0 3px rgba(12,18,44,.55),inset 0 0 0 4px rgba(201,162,78,.22),0 10px 28px rgba(0,0,0,.35)}

  /* HUD */
  .hud{margin:10px 12px 0;padding:10px 12px}
  .hud-row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
  .hud-row .btns{display:flex;gap:5px}
  .hud-row b{font-size:15px;letter-spacing:.06em;color:var(--gold2)}
  .chip{border:1px solid var(--gold);color:var(--gold2);padding:1px 6px;border-radius:3px;font-size:12px;font-weight:600;letter-spacing:.1em}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px}
  .bar{font-size:12px;color:var(--muted);letter-spacing:.1em}
  .bar .track{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:4px;border:1px solid rgba(201,162,78,.25)}
  .bar .fill{height:100%;transition:width .5s}
  .seal-btn{border:1px solid var(--gold);background:transparent;color:var(--gold2);border-radius:50%;width:32px;height:32px;padding:0;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer}

  /* Scene */
  #scene{flex:1;position:relative;min-height:220px}
  #chars{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;align-items:flex-end;gap:0}
  .char .nm{position:relative;left:-14px}
  .char .bubble{left:40%}
  .char{position:relative;text-align:center}
  .fig{width:140px;height:182px;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28))}
  .char .nm{display:inline-block;margin-top:2px;font-size:12px;color:var(--gold2);background:rgba(12,18,44,.65);border:1px solid rgba(201,162,78,.5);padding:0 8px;border-radius:3px;letter-spacing:.2em}
  .char .emo{position:absolute;top:8px;left:84px;width:26px;height:26px;background:var(--ver);color:#fff;border:1px solid var(--gold2);border-radius:4px;
    font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .char.ta.angry .fig{animation:shake .4s infinite}
  .char.ta.happy .fig,.char.ta.shy .fig{animation:float 3s ease-in-out infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .bubble{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);border:1px solid var(--gold);
    padding:8px 12px;border-radius:6px;font-size:14px;width:max-content;max-width:210px;box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0;transition:opacity .4s;pointer-events:none;line-height:1.6;z-index:2}
  .bubble.show{opacity:1}
  .bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--gold)}
  #pet{position:absolute;bottom:10px;font-size:28px;animation:float 2s infinite;display:none}

  /* 背景音乐小窗 */
  #music{position:absolute;top:8px;right:12px;width:128px;border:1px solid var(--gold);border-radius:4px;overflow:hidden;background:#000;
    box-shadow:0 4px 12px rgba(0,0,0,.35);transition:opacity .3s}
  #music.off{opacity:0;pointer-events:none}
  #music iframe{display:block;width:128px;height:72px;border:0}
  #music .cap{cursor:pointer;font-size:10px;color:var(--gold2);background:rgba(12,18,44,.85);padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seal-btn.muted{opacity:.45;text-decoration:line-through}

  /* Panel */
  .panel{margin:0 12px 12px;padding:12px;max-height:46vh;display:flex;flex-direction:column}
  #actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .act{border:1px solid rgba(201,162,78,.45);border-radius:6px;padding:8px 4px;min-height:62px;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--txt);
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.01));cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .1s}
  .act:active{transform:scale(.95)}
  .act .ic{width:28px;height:28px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:var(--gold2);letter-spacing:0}
  .act.hl{background:linear-gradient(180deg,#c2452f,#8f2a22);border-color:var(--gold2)}
  .act.hl .ic{border-color:var(--gold2)}
  .act.warn{background:linear-gradient(180deg,#4b3270,#2e1f4a)}
  .act:disabled{opacity:.4}
  #log{margin-top:10px;font-size:12.5px;color:var(--muted);overflow-y:auto;max-height:76px;line-height:1.7;border-top:1px solid rgba(201,162,78,.25);padding-top:6px}
  #log div:first-child{color:var(--txt)}

  /* Modal */
  #modal{position:fixed;inset:0;z-index:10;background:rgba(6,8,26,.55);display:flex;align-items:flex-end;justify-content:center}
  #modal[hidden]{display:none}
  .card{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--paper);border-top:3px solid var(--gold);border-radius:10px 10px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .28s ease-out;
    background-image:radial-gradient(circle at 100% 0,rgba(201,162,78,.12),transparent 40%),radial-gradient(circle at 0 100%,rgba(178,58,46,.06),transparent 40%)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .card h3{margin:0 0 12px;font-size:18px;text-align:center;letter-spacing:.18em;color:var(--ver2);font-weight:900}
  .card h3::before,.card h3::after{content:"❖";color:var(--gold);font-size:12px;margin:0 10px;vertical-align:middle}
  .card p{margin:6px 0;line-height:1.8;font-size:15px}
  .hint{background:#f4ecd8;border-left:3px solid var(--ver);padding:8px 10px;border-radius:3px;font-size:14px;color:#5a4a3a}
  .note{color:#8a7a5a;font-size:13px}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .opt{border:1px solid var(--line);border-radius:6px;padding:13px 14px;font-family:inherit;font-size:15px;text-align:left;background:var(--paper2);color:var(--ink);cursor:pointer}
  .opt:active{background:#eadcb8}
  .opt.primary{background:linear-gradient(180deg,#c2452f,#8f2a22);color:#fbeccb;border-color:var(--ver2);text-align:center;font-weight:700;letter-spacing:.15em}
  .opt.ghost{background:transparent;border-color:transparent;color:#8a7a5a;text-align:center}
  .opt.right{background:#dcefd9;border-color:#9cc596}.opt.wrong{background:#f6dcd6;border-color:#d9a197}
  .opt small{display:block;color:#8a7a5a;margin-top:2px;font-size:12.5px}
  textarea,input[type=text]{width:100%;border:1px solid var(--line);background:#fffdf7;border-radius:6px;padding:12px;font-size:16px;font-family:inherit;outline:none;user-select:text;-webkit-user-select:text;color:var(--ink)}
  textarea{min-height:120px;resize:none;line-height:1.8}
  textarea:focus,input:focus{border-color:var(--gold)}
  .hold{margin:18px auto 6px;width:150px;height:150px;border-radius:50%;border:0;cursor:pointer;
    background:conic-gradient(var(--ver) calc(var(--p,0)*1%), #eadfc6 0);display:flex;align-items:center;justify-content:center;touch-action:none}
  .hold span{width:126px;height:126px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:var(--ver);font-family:"Ma Shan Zheng",serif}

  /* Setup */
  #setup{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,8,26,.35)}
  #setup .card{border-radius:10px;max-width:420px;border:1px solid var(--gold);border-top-width:3px}
  .title{text-align:center;font-family:"Ma Shan Zheng","STXingkai","KaiTi",serif;font-size:48px;color:var(--ver2);margin:0;line-height:1.2}
  .sub{text-align:center;color:#8a7a5a;font-size:14px;margin-bottom:16px;letter-spacing:.3em}
  .roles{display:flex;gap:8px;margin:6px 0 12px}
  .roles button{flex:1;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper2);font-family:inherit;font-size:15px;letter-spacing:.3em;cursor:pointer;color:var(--ink)}
  .roles button.on{border-color:var(--ver);background:#f6e2d8;color:var(--ver2);font-weight:700}
  label.lb{font-size:13px;color:#8a7a5a;font-weight:600;display:block;margin-top:6px;letter-spacing:.15em}

  /* Report */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .stat{background:#f4ecd8;border:1px solid var(--line);border-radius:6px;padding:10px 6px;text-align:center}
  .stat b{display:block;font-size:20px;color:var(--ver2)}
  .stat span{font-size:12px;color:#8a7a5a}
  .sec{font-size:14px;font-weight:900;margin:16px 0 6px;color:var(--ver2);letter-spacing:.15em}
  .health{display:flex;align-items:center;gap:14px;background:#f4ecd8;border:1px solid var(--gold);border-radius:6px;padding:12px}
  .health .score{font-size:42px;font-weight:900;color:var(--ver);line-height:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{border:1px solid var(--line);padding:7px 12px;border-radius:4px;background:var(--paper2);font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .tag.on{background:var(--ver2);border-color:var(--ver2);color:var(--paper)}
  .moods{display:flex;justify-content:space-between;margin:8px 0}
  .moods button{font-family:"Ma Shan Zheng",serif;font-size:28px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:50%;width:17%;aspect-ratio:1;cursor:pointer}
  .moods button.on{background:var(--ver);border-color:var(--gold);color:#fff}
  .chart{width:100%;height:110px;background:#fffdf7;border:1px solid var(--line);border-radius:6px}
  .legend{font-size:12px;color:#8a7a5a;display:flex;gap:12px}
  .legend i{display:inline-block;width:10px;height:3px;vertical-align:middle;margin-right:4px}
  ul.tips{margin:4px 0;padding-left:20px;font-size:14px;line-height:1.8}

  .petal{position:fixed;z-index:30;pointer-events:none;font-size:20px;animation:floatup 1.8s ease-out forwards;text-shadow:0 0 6px rgba(255,255,255,.6)}
  @keyframes floatup{from{transform:translate(0,0) scale(.6) rotate(0);opacity:1}to{transform:translate(var(--dx),-150px) scale(1.2) rotate(180deg);opacity:0}}
  #fade{position:fixed;inset:0;z-index:40;background:#060b26;color:var(--gold2);display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:18px;letter-spacing:.12em;line-height:2.2;opacity:0;pointer-events:none;transition:opacity 1.2s;padding:30px}
  #fade.on{opacity:1;pointer-events:auto}
  #toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-90px);z-index:50;background:rgba(12,18,44,.94);color:var(--txt);
    border:1px solid var(--gold);padding:9px 16px;border-radius:4px;font-size:14px;letter-spacing:.06em;transition:transform .3s;max-width:90vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="app">
  <header class="hud frame">
    <div class="hud-row">
      <span><b id="hDay">第一日</b> · <span id="hTime">辰时</span></span>
      <span class="chip" id="hStage">初遇</span>
      <span>◆ <b id="hGold">100</b></span>
      <span class="btns">
        <button class="seal-btn" id="btnMusic" aria-label="背景音乐">乐</button>
        <button class="seal-btn" id="btnBook" aria-label="TA的小册">册</button>
        <button class="seal-btn" id="btnReport" aria-label="情缘录">录</button>
      </span>
    </div>
    <div class="bars">
      <div class="bar">情缘 <span id="vAff">0</span><div class="track"><div class="fill" id="fAff" style="background:linear-gradient(90deg,#d9573a,#ff9ab3)"></div></div></div>
      <div class="bar">心绪 · <span id="eMood">静</span> <span id="vMood">60</span><div class="track"><div class="fill" id="fMood" style="background:linear-gradient(90deg,#c9a24e,#f3dc95)"></div></div></div>
    </div>
  </header>

  <section id="scene">
    <div id="chars">
      <div class="char me"><div id="meFig"></div><div class="nm" id="meNm">我</div></div>
      <div class="char ta" id="taChar">
        <div class="bubble" id="bubble"></div>
        <div class="emo" id="taEmo">静</div>
        <div id="taFig"></div><div class="nm" id="taNm">TA</div>
      </div>
    </div>
    <div id="pet">🦊</div>
    <div id="music"><div id="yt"></div><div class="cap" title="点击换下一首">♪ 想某人（合唱版）· 白嘉峻 / 王优秀</div></div>
  </section>

  <section class="panel frame">
    <div id="actions"></div>
    <div id="log"></div>
  </section>
</div>

<div id="modal" hidden><div class="card" id="card"></div></div>
<div id="setup"></div>
<div id="fade"></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cn = n => { const d = '零一二三四五六七八九'; if (n < 10) return d[n]; if (n === 10) return '十'; if (n < 20) return '十' + d[n % 10]; if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : ''); return String(n); };

/* ================= 人物立绘（背影） ================= */
// 随风飘动：同一路径在两种形态间缓动
const wave = (a, b, dur = 3.2) => `<animate attributeName="d" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="${a};${b};${a}"/>`;
const SLEEVE_R = ['M96 82 C 120 78, 150 92, 198 96 C 196 112, 190 124, 198 140 C 160 132, 130 120, 104 112 Z',
                  'M96 82 C 122 72, 152 82, 198 84 C 194 102, 192 118, 196 130 C 160 126, 130 118, 104 112 Z'];
const SLEEVE_L = ['M62 82 C 48 92, 36 110, 30 128 C 26 160, 30 190, 20 222 C 40 210, 50 180, 52 150 C 56 130, 62 112, 66 100 Z',
                  'M62 82 C 48 92, 37 110, 31 128 C 28 160, 34 190, 28 224 C 44 210, 52 180, 53 150 C 57 130, 62 112, 66 100 Z'];
const FIG = {
  f: (id) => {
    const skirt = ['M64 122 C 58 170, 50 214, 38 254 L 128 254 C 150 246, 178 236, 198 222 C 170 206, 132 172, 98 122 Z',
                   'M64 122 C 58 170, 50 214, 38 254 L 128 254 C 152 242, 180 228, 198 210 C 168 198, 130 170, 98 122 Z'];
    const hem = ['M38 254 L 128 254 C 150 246, 178 236, 198 222', 'M38 254 L 128 254 C 152 242, 180 228, 198 210'];
    const hair = ['M74 56 C 70 84, 80 108, 104 126 C 126 140, 150 142, 178 152 C 150 148, 124 138, 102 120 C 90 106, 86 80, 88 56 Z',
                  'M74 56 C 70 84, 82 106, 106 122 C 128 134, 152 134, 180 138 C 152 138, 126 130, 104 114 C 92 102, 86 80, 88 56 Z'];
    const ribbon = ['M66 118 C 100 150, 140 138, 198 160', 'M66 118 C 100 140, 142 152, 198 146'];
    return `<svg class="fig" viewBox="0 0 200 260"><defs>
      <linearGradient id="r${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8247"/><stop offset=".5" stop-color="#e6401f"/><stop offset="1" stop-color="#9f2216"/></linearGradient>
      <linearGradient id="s${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff6f0" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient>
      <linearGradient id="v${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/></linearGradient></defs>
      <path d="${SLEEVE_R[0]}" fill="url(#s${id})">${wave(...SLEEVE_R)}</path>
      <path d="${ribbon[0]}" stroke="#ff9a6a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9">${wave(...ribbon, 2.6)}</path>
      <path d="${skirt[0]}" fill="url(#r${id})">${wave(...skirt)}</path>
      <path d="${hem[0]}" stroke="#f2c46a" stroke-width="3" fill="none">${wave(...hem)}</path>
      <path d="M80 126 C 78 170, 74 210, 70 252 M90 126 C 96 160, 104 196, 112 250 M72 126 C 66 170, 60 210, 54 252" stroke="rgba(255,210,150,.45)" stroke-width="1.2" fill="none"/>
      <path d="${SLEEVE_L[0]}" fill="url(#v${id})">${wave(...SLEEVE_L, 3.6)}</path>
      <path d="M62 80 C 58 100, 62 114, 66 124 L 96 124 C 100 114, 104 100, 98 80 C 90 84, 70 84, 62 80 Z" fill="url(#r${id})"/>
      <path d="M70 92 C 76 100, 84 100, 90 92 M68 106 C 76 112, 86 112, 92 106" stroke="#f2c46a" stroke-width="1.2" fill="none"/>
      <path d="M64 116 L 98 116 L 97 125 L 65 125 Z" fill="#f2c46a"/><circle cx="81" cy="121" r="2.6" fill="#5fc4a8"/>
      <path d="M64 80 C 66 72, 74 68, 80 68 C 86 68, 94 72, 96 80 C 88 84, 72 84, 64 80 Z" fill="#f1d0bc"/>
      <path d="M62 80 C 72 85, 88 85, 98 80" stroke="#f2c46a" stroke-width="2" fill="none"/>
      <rect x="76" y="56" width="8" height="14" fill="#ecc6b0"/>
      <path d="${hair[0]}" fill="#15111a">${wave(...hair, 2.8)}</path>
      <ellipse cx="80" cy="46" rx="13" ry="15" fill="#15111a"/>
      <ellipse cx="80" cy="27" rx="9.5" ry="8.5" fill="#15111a"/><ellipse cx="89" cy="31" rx="5" ry="6" fill="#15111a"/>
      <path d="M69 31 Q 80 18 91 31" stroke="#f2c46a" stroke-width="2.6" fill="none"/>
      <path d="M74 25 L 72 15 M80 21 L 80 10 M86 25 L 88 15" stroke="#f2c46a" stroke-width="1.6"/>
      <circle cx="72" cy="15" r="1.8" fill="#e03a3a"/><circle cx="80" cy="10" r="2" fill="#e03a3a"/><circle cx="88" cy="15" r="1.8" fill="#e03a3a"/><circle cx="80" cy="24" r="2.6" fill="#e03a3a"/>
      <path d="M90 29 L 107 22" stroke="#f2c46a" stroke-width="1.6" stroke-linecap="round"/>
      <g><path d="M107 22 L 108 36" stroke="#f2c46a" stroke-width="1"/><circle cx="108" cy="30" r="1.3" fill="#f2c46a"/><circle cx="108" cy="37" r="1.8" fill="#e03a3a"/>
        <animateTransform attributeName="transform" type="rotate" values="-8 107 22;8 107 22;-8 107 22" dur="2.4s" repeatCount="indefinite"/></g>
    </svg>`;
  },
  m: (id) => {
    const skirt = ['M60 122 C 56 170, 52 214, 46 254 L 120 254 C 140 248, 160 240, 178 228 C 150 212, 124 176, 100 122 Z',
                   'M60 122 C 56 170, 52 214, 46 254 L 120 254 C 142 246, 164 236, 180 220 C 150 206, 124 174, 100 122 Z'];

  $('#modal').hidden = false;
  const btn = $('#holdBtn'); let p = 0, iv = null;
  const stop = () => { clearInterval(iv); iv = null; if (p < 100) { p = 0; btn.style.setProperty('--p', 0); } };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); if (iv) return;
    iv = setInterval(() => {
      p += 4; btn.style.setProperty('--p', p);
      if (navigator.vibrate && p % 20 === 0) navigator.vibrate(10);
      if (p >= 100) { clearInterval(iv); iv = null; closeModal(); cb(); }
    }, 60);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
}

/* ================= 核心逻辑 ================= */
function change(aff, mood) {
  S.aff = clamp(S.aff + aff, 0, 100);
  S.mood = clamp(S.mood + mood, 0, 100);
  if (S.stage === 0 && S.aff >= STAGES[1].need) {
    S.stage = 1; log('你们渐渐熟络，心中暗生情愫——「倾心」');
    setTimeout(() => toast('解锁：同游 · 温存 · 心有灵犀'), 400);
  }
  syncEmotion();
}
function syncEmotion() {
  if (S.reason || S.emotion === 'cold') return;
  S.emotion = S.mood >= 75 ? 'happy' : S.mood >= 40 ? 'calm' : 'down';
}
function slotIndex() { return S.day * 4 + S.time; }
function advance() { S.time++; if (S.time > 3) endDay(); render(); save(); }
function endDay() {
  if (S.stage >= 1 && !S.interacted) { S.mood = clamp(S.mood - 15, 0, 100); S.neglect++; log(`今日几乎未曾陪伴${S.ta}，TA有些落寞`); }
  if (S.reason) S.mood = clamp(S.mood - 8, 0, 100);
  if (S.emotion === 'cold') { S.emotion = 'sad'; S.wrong = 0; S.guessed = false; }
  S.history.push({ day: S.day, mood: S.mood, aff: S.aff });
  S.day++; S.time = 0; S.interacted = false;
  S.today = { quiz: false, pet: false, intim: [] };
  if (!S.reason) S.mood = Math.round(S.mood + (60 - S.mood) * 0.2);
  syncEmotion();
  log('晨钟响起，新的一日');
}
function interact() { S.interacted = true; S.neglect = Math.max(0, S.neglect - 1); }

function maybeAnger(trigger) {
  if (S.stage < 1 || S.reason || S.emotion === 'cold') return;
  let p = 0.05 + S.neglect * 0.07 + (S.mood < 40 ? 0.15 : 0);
  if (trigger === 'bad') p = 0.6;
  if (Math.random() >= p) return;
  let r;
  if (trigger === 'bad') r = 'perfunctory';
  else if (S.neglect >= 2) r = 'neglect';
  else r = rand(['forgot', 'jealous', 'outside', ...(S.neglect ? ['neglect'] : [])]);
  S.reason = r; S.emotion = 'angry'; S.guessed = false; S.wrong = 0; S.petHint = false;
  S.mood = Math.min(S.mood, 35);
  S.stats.quarrels++; S.stats.reasons[r] = (S.stats.reasons[r] || 0) + 1; S.stats.angerStart = slotIndex();
  setTimeout(() => say(REASONS[r].line), 300);
  log(`${S.ta}动了气……`);
}

function doChat() {
  S.stats.chats++;
  const unknown = Object.keys(PREFS).filter(k => !S.known[k]);
  if (unknown.length && Math.random() < 0.45) {
    const k = rand(unknown); S.known[k] = true;
    say(PREFS[k].line(S.prefs[k])); change(2, 5); interact();
    log(`你将「${S.ta}${PREFS[k].label}」记入了小册`);
    toast('已记入小册');
    maybeAnger(); advance(); return;
  }
  const t = rand(TOPICS);
  modal(esc(S.ta), `<p style="text-align:center">「${t.q}」</p>`, t.o.map(o => ({
    t: o[0], fn: () => {
      closeModal();

      log(`你说：「${o[0]}」`);
      maybeAnger(o[2] <= -15 ? 'bad' : undefined); advance();
    }
  })));
}

function doShop() {
  modal('珍宝阁', `<p class="note">购得之物即刻赠予${esc(S.ta)}（玉佩与灵宠除外）。若恰是TA心头所好，情意倍增。</p>`,
    ITEMS.filter(it => !(it.k === 'pet' && S.pet) && !(it.k === 'ring' && S.ring)).map(it => ({
      t: `${it.ic}　${it.n}`, d: it.p ? `灵石 ${it.p}` : '分文不取，唯需真心', fn: () => buy(it)
    })));
}
function buy(it) {
  if (S.gold < it.p) { toast('灵石不足，不妨先去天庭当值'); return; }
  if (it.write) { writeModal('亲笔情笺', `写下想对${esc(S.ta)}说的话（至少八字）`, txt => giveGift(it, txt)); return; }
  S.gold -= it.p; closeModal();
  if (it.k === 'ring') { S.ring = true; log('你悄悄求得一对同心玉佩'); toast('玉佩已收好，待情缘圆满便可求亲'); render(); save(); return; }
  if (it.k === 'pet') { S.pet = true; change(3, 15); say('好漂亮的小狐狸……唤它「雪团」可好？'); log('你们收养了九尾白狐「雪团」'); petals(8); render(); save(); return; }
  giveGift(it);
}
function giveGift(it, letter) {
  S.stats.gifts++; interact();
  const fav = S.prefs[it.k] === it.n;
  if (fav) { S.known[it.k] = true; change(8, 25); say('你怎知我最喜欢这个？'); petals(); }
  else if (S.stage === 0) { change(2, 6); say('我们才初相识……不过，多谢。'); }
  else { change(3, 10); say(rand(['多谢你。', '是给我的？', '……我很喜欢。'])); }
  if (letter) log(`你写了一封情笺：「${letter.slice(0, 20)}${letter.length > 20 ? '…' : ''}」`);
  else log(`你赠予${S.ta}「${it.n}」${fav ? '——正是TA心头所好' : ''}`);
  advance();
}

function doIntim() {

  const opts = [
    { id: 'hand', t: '执手', min: 1, a: 2, m: 8, say: '……你的手好暖。', time: false },
    { id: 'pat', t: '抚发', min: 1, a: 2, m: 8, say: '做什么呀……', time: false },
    { id: 'hug', t: '相拥', min: 2, a: 3, m: 12, say: '再抱一会儿。', time: false, hold: true },
    { id: 'kiss', t: '轻吻', min: 2, a: 3, m: 12, say: '……！', time: false, shy: true },
    { id: 'star', t: '倚肩观星', min: 2, a: 3, m: 15, say: '若能日日如此便好了。', time: true, night: true },
    { id: 'night', t: '红烛帐暖', min: 3, a: 4, m: 20, time: true, night: true, fade: true },
  ];
  modal('温存', '', opts.map(o => {
    const lock = S.stage < o.min ? `需至「${STAGES[o.min].name}」` : (o.night && !night ? '唯子时可行' : '');
    return {
      t: o.t + (S.today.intim.includes(o.id) ? '　✓' : ''), d: lock || (o.time ? '将耗去一个时辰' : ''), cls: lock ? 'ghost' : '',
      fn: () => {
        if (lock) { toast(lock); return; }
        if (S.mood < 30) { closeModal(); change(0, -3); say('此刻……不想。'); render(); save(); return; }
        const go = () => {
          const repeat = S.today.intim.includes(o.id);
          if (!repeat) S.today.intim.push(o.id);
          S.stats.intim++; interact();
          change(repeat ? 1 : o.a, repeat ? 3 : o.m);
          if (o.shy && !S.reason) S.emotion = 'shy';
          if (o.fade) {
            fade('红烛摇曳，纱帐轻垂……<br>窗外云海翻涌，星河流转。<br><br>这一夜，只属于你们。', () => { petals(18); say('……安歇吧。'); });
            log('红烛帐暖，一夜温柔');
          } else { say(o.say); petals(6); log(o.t); }
          if (o.time) advance(); else { render(); save(); }
        };
        if (o.hold) holdModal('相拥', `张开双臂，拥住${esc(S.ta)}`, go); else { closeModal(); go(); }
      }
    };
  }));
}
function fade(html, cb) {
  const f = $('#fade'); f.innerHTML = html; f.classList.add('on');

/* ----- 哄 ----- */
function coax() {
  const R = REASONS[S.reason];
  if (!S.guessed) {
    const others = shuffle(Object.keys(REASONS).filter(k => k !== S.reason)).slice(0, 3);
    const choices = shuffle([S.reason, ...others]);
    let body = `<p style="text-align:center">${esc(S.ta)}：「${rand(['无事。', '我没有生气。', '你自己想。', '……'])}」</p><p class="hint">${R.hint}</p>`;
    if (S.petHint) body += `<p class="hint" style="border-color:var(--gold)">🦊 雪团用尾巴指了指：「${R.label}」</p>`;
    body += `<p class="note">先猜出TA为何不快（猜错三次便要冷战）</p>`;
    modal('TA动了气', body, choices.map(k => ({
      t: `可是因为${REASONS[k].label}？`, fn: () => {
        if (k === S.reason) {
          S.guessed = true; S.emotion = 'sad'; say('……你知道便好。');
          log('你猜中了TA不快的缘由'); render(); save();
          coaxMethods();
        } else {
          S.wrong++; S.stats.wrong++; S.mood = clamp(S.mood - 10, 0, 100);
          say(rand(['你根本不懂我。', '不是。', '……你再想想。']));
          closeModal();
          if (S.wrong >= 3) { S.emotion = 'cold'; S.stats.cold++; log(`${S.ta}不愿再理你，冷战至明日`); toast('冷战开始……明日再哄吧'); }
          else toast(`猜错了（${S.wrong}/3）`);
          render(); save();
        }
      }
    })));
  } else coaxMethods();
}
function coaxMethods() {
  modal('如何哄TA', `<p class="note">缘由不同，哄法亦不同。选对了，方能真正和好。</p>`,
    Object.entries(METHODS).map(([k, m]) => ({
      t: m.t, d: m.d, fn: () => {
        if (m.cost && S.gold < m.cost) { toast('灵石不足'); return; }
        const done = () => { if (m.cost) S.gold -= m.cost; resolveCoax(k); };
        if (m.hold) holdModal('拥住TA', '什么都别说，抱紧便好', done);
        else if (m.write) writeModal('书信', '真诚写下你的心里话（至少八字）', done);
        else { closeModal(); done(); }
      }
    })));
}
function resolveCoax(m) {
  const R = REASONS[S.reason];
  const win = R.best.includes(m) || (m === 'joke' && Math.random() < 0.35);
  if (win) {
    S.stats.reconciled++; S.stats.wins[m] = (S.stats.wins[m] || 0) + 1;
    S.stats.recoverSlots.push(slotIndex() - S.stats.angerStart);
    S.reason = null; S.guessed = false; S.wrong = 0; S.tacit++;
    S.mood = Math.max(S.mood, 75); change(5, 0); S.emotion = 'happy';
    say(m === 'joke' ? '……好冷的笑话。可我还是笑了。' : rand(['……这次便原谅你。', '……抱紧些。', '你呀。']));
    petals(18); log(`冰释前嫌，默契 +1（${METHODS[m].t}）`);
  } else {
    S.mood = clamp(S.mood + 12, 0, 100);
    if (S.mood >= 55) {
      S.stats.reconciled++; S.stats.recoverSlots.push(slotIndex() - S.stats.angerStart);
      S.reason = null; S.guessed = false; change(2, 0); say('……罢了，不气了。'); log('TA渐渐消了气');
    } else { say(rand(['……还是有些难过。', '不是这样的。', '嗯。'])); log(`「${METHODS[m].t}」似乎不太对，TA仍不开心`); }
  }
  interact(); advance();
}

/* ----- 心有灵犀 ----- */
function doQuiz() {
  const keys = shuffle(Object.keys(PREFS)).slice(0, 5);
  let i = 0, score = 0;
  musicOverride = 'play'; updateMusicMode();
  const ask = () => {
    if (i >= keys.length) return finish();
    const k = keys[i], ans = S.prefs[k];
    const pool = shuffle([ans, ...shuffle(PREFS[k].pool.filter(v => v !== ans)).slice(0, 3)]);
    modal(`心有灵犀 · ${cn(i + 1)}`, `<p style="text-align:center">${esc(S.ta)}${PREFS[k].label}是？</p>${S.known[k] ? '<p class="hint">小册中记过此事</p>' : ''}`,
      pool.map(v => ({ t: v, fn: () => {
        const btns = $('#card').querySelectorAll('[data-i]');
        btns.forEach((b, j) => { b.onclick = null; if (pool[j] === ans) b.classList.add('right'); else if (pool[j] === v) b.classList.add('wrong'); });
        if (v === ans) score++;
        S.known[k] = true; i++; setTimeout(ask, 800);
      } })), true);
  };
  const finish = () => {
    musicOverride = null;
    S.today.quiz = true; interact();
    change(score * 2, score * 3); if (score >= 4) S.tacit++;
    const msg = score === 5 ? '天作之合。' : score >= 3 ? '你还算懂我。' : '你究竟有没有将我放在心上……';
    say(msg); if (score >= 3) petals();
    log(`心有灵犀 ${score}/5${score >= 4 ? '，默契 +1' : ''}`);
    modal('问毕', `<p style="font-size:40px;text-align:center;margin:10px;color:var(--ver2);font-weight:900">${score} / 5</p><p style="text-align:center">${msg}</p>`, [{ t: '好', cls: 'primary', fn: () => { closeModal(); advance(); } }], true);
  };
  ask();
}

function lineChart(series) {
  const w = 300, h = 100, pad = 8;
  const n = Math.max(...series.map(s => s.data.length));
  if (n < 2) return '<p class="note">记录尚少，多过几日、多记几笔，便能看到走势</p>';
  let svg = `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;
  for (let g = 1; g < 4; g++) svg += `<line x1="0" x2="${w}" y1="${h * g / 4}" y2="${h * g / 4}" stroke="#efe4c8" stroke-width="1"/>`;
  series.forEach(s => {
    const pts = s.data.map((v, i) => `${(pad + i * (w - 2 * pad) / (n - 1)).toFixed(1)},${(h - pad - v / s.max * (h - 2 * pad)).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  });
  return svg + '</svg>';
}

  for (let x = 0; x < W + 46; x += 46) {
    cx.fillRect(x - 3, top - 6, 7, bot - top + 8);
    cx.beginPath(); cx.arc(x + .5, top - 8, 5, 0, Math.PI * 2); cx.fill();
  }
  // 大婚红绸
  if (S && S.stage >= 4) {
    cx.strokeStyle = '#c8282e'; cx.lineWidth = 4;
    for (let x = 0; x < W; x += 46) { cx.beginPath(); cx.moveTo(x, top + 2); cx.quadraticCurveTo(x + 23, top + 18, x + 46, top + 2); cx.stroke(); }
  }
}

resize(); requestAnimationFrame(frame); showSetup();
</script>
